<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta http-equiv="X-UA-Compatible" content="ie=edge" />
  <meta name="theme-color" content="#0d0221" />
  <meta name="description" content="A little something made with love — an animated birthday surprise." />
  <meta name="robots" content="noindex" />
  <link rel="shortcut icon" type="image/png" href="img/favicon.png" />
  <link rel="apple-touch-icon" href="img/favicon.png" />
  <title>Happy Birthday, Mantasha! 🎂💖</title>
  <!-- Google Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&family=Great+Vibes&display=swap" rel="stylesheet">
  <!-- Style -->
  <link rel="stylesheet" href="./style/main.css" />
</head>

<body>
  <!-- Loading curtain (fades away once everything is ready) -->
  <div class="loader" id="loader">
    <div class="loader-heart">🎂</div>
  </div>

  <!-- Background Music -->
  <audio class="song" loop preload="auto">
    <source src="" type="audio/mpeg">
    Your browser isn't invited for super fun audio time.
  </audio>

  <!-- All sections are rendered here dynamically from config.js -->
  <div class="container"></div>

  <!-- Libraries — bundled locally in vendor/ so the page works offline.
       A CDN fallback (set per library below) is only used if a local file
       is missing. We use a small loader instead of document.write, which
       would re-open the document and break the scripts that follow. -->
  <script src="./vendor/gsap.min.js"></script>
  <script src="./vendor/sweetalert2.all.min.js"></script>

  <!-- Config & Engine -->
  <script src="./config.js"></script>
  <script src="./script/main.js"></script>
</body>

</html>
